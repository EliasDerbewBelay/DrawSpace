# Render Blueprint — backend only (Postgres on Supabase)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: drawspace-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: REDIS_URL
        sync: false
